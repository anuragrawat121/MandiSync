# Railway project template: API + daily ingest. Add a Postgres plugin in the UI
# and enable PostGIS (CREATE EXTENSION postgis) — the API entrypoint also tries this.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Backend/Dockerfile"

[deploy]
startCommand = "python scripts/entrypoint.py"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
