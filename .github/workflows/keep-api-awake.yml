name: Keep API awake

# Render free sleeps after ~15 minutes idle. This ping keeps the API warm
# most of the time so GitHub Pages does not wait on a cold start.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API
        env:
          API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "Missing GitHub Actions secret NEXT_PUBLIC_API_BASE_URL"
            exit 1
          fi
          url="${API_BASE%/}/health"
          echo "GET $url"
          curl -fsS --retry 2 --retry-all-errors --max-time 90 "$url"
