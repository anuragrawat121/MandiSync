# Production stack: PostGIS + FastAPI + daily ingest + Next.js
#
#   cp .env.production.example .env.production
#   # edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# UI:  http://localhost:3000
# API: http://localhost:8000/docs

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mandisync_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mandisync_db}
    volumes:
      - mandisync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mandisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./Backend
    container_name: mandisync_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mandisync_db}
      SKIP_DB_INIT_ON_IMPORT: "true"
      API_KEY: ${API_KEY:?Set API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
      ALLOW_SEED_FALLBACK: ${ALLOW_SEED_FALLBACK:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: ./Backend
    container_name: mandisync_ingest
    command: ["python", "scripts/ingest_loop.py"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mandisync_db}
      SKIP_DB_INIT_ON_IMPORT: "true"
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:?Set AGMARKNET_API_KEY for live prices}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        BUILD_STAMP: ${BUILD_STAMP:-local}
    container_name: mandisync_web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mandisync_pgdata:
