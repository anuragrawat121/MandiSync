# Render Blueprint: free FastAPI web service (sleeps after ~15 min idle).
# Database stays on Supabase. Website stays on GitHub Pages.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mandisync-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/entrypoint.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONPATH
        value: "."
      - key: SKIP_DB_INIT_ON_IMPORT
        value: "true"
      - key: RUN_INGEST_LOOP
        value: "true"
      - key: INGEST_START_DELAY_SECONDS
        value: "90"
      - key: INGEST_RETRY_SECONDS
        value: "1800"
      - key: MAX_STALENESS_DAYS
        value: "7"
      - key: ALLOW_SEED_FALLBACK
        value: "false"
      - key: DB_WAIT_SECONDS
        value: "180"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_USER_USERNAME
        sync: false
      - key: APP_USER_PASSWORD
        sync: false
      - key: APP_ADMIN_USERNAME
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
